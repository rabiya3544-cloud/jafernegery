<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#071416">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Browse and stream videos posted by Jafer (@jafernegery).">
  <meta name="author" content="jafernegery">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Jafer (@jafernegery) — Video Explore">
  <meta property="og:description" content="Browse and stream videos posted by Jafer (@jafernegery).">
  <meta property="og:url" content="https://jafernegery.vercel.app/">
  <title>Jafer (@jafernegery) — Video Explore</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  	<div class="app">
		<header class="top-bar" hidden>
			<h1><i class="fa-solid fa-compass"></i> Explore</h1>
			<button class="icon-btn" aria-label="Cast"> <i class="fa-solid fa-tv"></i> </button>
		</header>
		<section class="profile-block">
			<div class="avatar"> <img src="IMG_7379.png" alt=""> <i class="fa-solid fa-user" hidden></i> </div>
			<div class="profile-info">
				<div class="profile-name"> <span class="nickname">Jafer</span> <span class="username">@jafernegery</span> </div>
				<div class="stats-row">
					<div class="stat"> <span class="stat-value">248</span> <span class="stat-label">Following</span> </div>
					<div class="stat"> <span class="stat-value">97.1K</span> <span class="stat-label">Followers</span> </div>
					<div class="stat"> <span class="stat-value">1.7M</span> <span class="stat-label">Likes</span> </div>
					<div class="stat"> <span class="stat-value">1.2K</span> <span class="stat-label">Videos</span> </div>
				</div>
			</div>
		</section>
		<nav class="tab-bar" role="tablist" hidden>
			<button class="tab-btn active" data-tab="posts" role="tab" aria-selected="true" aria-label="Posts"> <i class="fa-solid fa-table-cells"></i> </button>
			<button class="tab-btn" data-tab="private" role="tab" aria-selected="false" aria-label="Private"> <i class="fa-solid fa-lock"></i> </button>
			<button class="tab-btn" data-tab="reposts" role="tab" aria-selected="false" aria-label="Reposts"> <i class="fa-solid fa-retweet"></i> </button>
			<button class="tab-btn" data-tab="favorites" role="tab" aria-selected="false" aria-label="Favorites"> <i class="fa-solid fa-star"></i> </button>
			<button class="tab-btn" data-tab="liked" role="tab" aria-selected="false" aria-label="Liked"> <i class="fa-solid fa-heart"></i> </button>
		</nav>
		<div class="tab-panels">
			<section class="tab-panel active" id="panel-posts" role="tabpanel">
				<div id="linksGrid" class="grid">
					<div id="gridLoading" class="grid-loading"> <i class="fa-solid fa-circle-notch"></i> <span>Loading videos…</span> </div>
				</div>
			</section>
			<section class="tab-panel" id="panel-private" role="tabpanel">
				<div id="playerOverlay" class="player-overlay active" role="dialog" aria-modal="true" aria-hidden="false">
					<div class="player-stage">
						<video id="playerVideo" playsinline webkit-playsinline preload="metadata"></video>
						<div id="playerLoading" class="player-loading"> <i class="fa-solid fa-circle-notch"></i> </div>
						<div id="playerPauseInd" class="player-pause-ind"> <i class="fa-solid fa-play"></i> </div>
					</div>
					<div class="player-top">
						<button id="playerClose" class="player-close" aria-label="Close"> <i class="fa-solid fa-arrow-left"></i> </button>
						<div id="playerTitle" class="player-title">2025-03-28</div>
						<div id="playerSize" class="player-size">—</div>
					</div>
					<div class="player-rail">
						<button class="rail-btn" id="railLike" aria-label="Like"> <i class="fa-regular fa-heart"></i> <span class="rail-count" id="railLikes">0</span> </button>
						<button class="rail-btn" id="railMute" aria-label="Mute"> <i class="fa-solid fa-volume-high"></i> </button>
						<button class="rail-btn" id="railDownload" aria-label="Download"> <i class="fa-solid fa-download"></i> </button>
					</div>
					<div class="player-meta">
						<div class="player-author" id="playerAuthor">@jafernegery</div>
						<div class="player-caption" id="playerCaption"></div>
					</div>
				</div>
			</section>
			<section class="tab-panel" id="panel-reposts" role="tabpanel">
				<div class="grid"></div>
			</section>
			<section class="tab-panel" id="panel-favorites" role="tabpanel">
				<div class="grid"></div>
			</section>
			<section class="tab-panel" id="panel-liked" role="tabpanel">
				<div class="grid"></div>
			</section>
		</div>
		<nav class="bottom-nav" hidden>
			<button class="nav-item"> <i class="fa-solid fa-house nav-icon"></i> <span>Home</span> </button>
			<button id="linksLoadBtn" class="nav-item active"> <i class="fa-solid fa-compass nav-icon"></i> <span>Discover</span> </button>
			<button id="linksSyncBtn" class="create-btn" aria-label="Create"> <i class="fa-solid fa-plus"></i> </button>
			<button class="nav-item"> <i class="fa-solid fa-inbox nav-icon"></i> <span>Inbox</span> </button>
			<a href="downloader.html" class="nav-item"> <i class="fa-solid fa-user nav-icon"></i> <span>Downloader</span> </a>
		</nav>
	</div>
	<div class="bottom-nav">ከተዘጋው የጃፋር ቲክቶክ አካውንት ተፖስተው የነበሩ ቪዲዮዎች</div>
</body>
</html>
